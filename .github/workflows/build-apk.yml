name: Build AI BELAJAR APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip AI_BELAJAR_Android_Project.zip

      - name: Build APK
        working-directory: AI_BELAJAR/android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AI-BELAJAR-APK
          path: AI_BELAJAR/android/app/build/outputs/apk/debug/app-debug.apk
